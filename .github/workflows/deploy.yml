name: Deploy CMS Worker

# Push-to-deploy for the standalone FlopoCMS worker (`flopocms`).
# Worker secrets and vars (GITHUB_PAT, GITHUB_REPO, …) live on the Cloudflare
# dashboard, never in this repo, so redeploys never overwrite them.

on:
  push:
    branches:
      - main
    paths:
      - 'packages/cms/**'
      - 'packages/blocks/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-cms-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, migrate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm --filter @jeflopodev/cms run test

      - name: Apply D1 migrations
        run: pnpm --filter @jeflopodev/cms run d1:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build and deploy to Cloudflare Workers
        run: pnpm --filter @jeflopodev/cms run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Non-secret per-deployment config. GitHub forbids the GITHUB_ prefix
          # for secret names, so it lives here as CONTENT_REPO (or as
          # GITHUB_REPO under the Variables tab) and is mapped to the
          # GITHUB_REPO binding the Worker reads. Flows into
          # cloudflare.config.ts so no site name is hardcoded.
          GITHUB_REPO: ${{ vars.GITHUB_REPO || secrets.CONTENT_REPO }}
